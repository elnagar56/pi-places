<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5c2d91" />
  <link rel="manifest" href="./manifest.json">
  <title>Pi Places — دليل الأماكن الداعمة لـ Pi</title>
  <style>
    :root {
      --pi-purple: #5c2d91;
      --pi-purple-dark: #3f1c66;
      --pi-gold: #f5b700;
      --bg: #f6f4fa;
      --card: #ffffff;
      --text: #1e1b2e;
      --muted: #66617a;
      --border: #e4dff0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 40px;
    }

    header {
      background: linear-gradient(135deg, var(--pi-purple-dark), var(--pi-purple));
      color: #fff;
      padding: 24px 16px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(63, 28, 102, 0.2);
    }

    header h1 {
      font-size: 1.6rem;
      margin-bottom: 6px;
    }

    header p {
      font-size: 0.92rem;
      opacity: 0.92;
    }

    .badge {
      display: inline-block;
      margin-top: 10px;
      background: rgba(245, 183, 0, 0.2);
      color: var(--pi-gold);
      border: 1px solid rgba(245, 183, 0, 0.5);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .container {
      max-width: 820px;
      margin: -14px auto 0;
      padding: 0 14px;
    }

    .controls {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 6px 20px rgba(30, 27, 46, 0.06);
      margin-bottom: 16px;
    }

    .search-input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 12px;
    }

    .search-input:focus {
      border-color: var(--pi-purple);
    }

    .categories {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cat-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.84rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .cat-btn.active {
      background: var(--pi-purple);
      color: #fff;
      border-color: var(--pi-purple);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .card h2 {
      font-size: 1.05rem;
      color: var(--pi-purple-dark);
    }

    .tag {
      background: #efeaf8;
      color: var(--pi-purple);
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 8px;
      white-space: nowrap;
      font-weight: 600;
    }

    .meta {
      font-size: 0.86rem;
      color: var(--muted);
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .pi-accepted {
      font-size: 0.8rem;
      font-weight: 700;
      color: #16794c;
    }

    .fav-btn {
      border: 1px solid var(--border);
      background: #fff;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .fav-btn.saved {
      background: #fff8e1;
      border-color: var(--pi-gold);
      color: #8a6200;
      font-weight: 600;
    }

    .add-box {
      margin-top: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .add-box h3 {
      font-size: 1rem;
      margin-bottom: 10px;
      color: var(--pi-purple-dark);
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    .form-row input,
    .form-row select {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.9rem;
      background: #fff;
    }

    .submit-btn {
      background: var(--pi-purple);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: var(--pi-purple-dark);
    }

    .empty {
      text-align: center;
      padding: 28px;
      color: var(--muted);
      background: var(--card);
      border-radius: 14px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <h1>Pi Places</h1>
    <p>دليل المتاجر والخدمات التي تقبل الدفع بعملة Pi</p>
    <span class="badge">Pi Network Directory</span>
    <div id="langSwitcher" style="margin-top: 12px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
  <button type="button" data-lang="ar" class="cat-btn" style="background: #fff; color: #3f1c66; border: none; font-weight: 600;">العربية</button>
  <button type="button" data-lang="en" class="cat-btn" style="background: rgba(255,255,255,0.18); color: #fff; border: 1px solid rgba(255,255,255,0.4);">English</button>
  <button type="button" data-lang="zh" class="cat-btn" style="background: rgba(255,255,255,0.18); color: #fff; border: 1px solid rgba(255,255,255,0.4);">中文</button>
    </div>
    
  </header>

  <main class="container">
    <section class="controls">
      <input
        id="searchInput"
        class="search-input"
        type="text"
        placeholder="ابحث باسم المتجر أو المدينة..."
      />
      <div class="categories" id="categoryBar">
        <button class="cat-btn active" data-cat="الكل">الكل</button>
        <button class="cat-btn" data-cat="مطاعم ومقاهي">مطاعم ومقاهي</button>
        <button class="cat-btn" data-cat="إلكترونيات">إلكترونيات</button>
        <button class="cat-btn" data-cat="خدمات">خدمات</button>
        <button class="cat-btn" data-cat="مفضلة">المفضلة</button>
      </div>
    </section>

    <section class="grid" id="placesGrid"></section>

    <section class="add-box">
      <h3>إضافة مكان جديد إلى الدليل</h3>
      <form id="addPlaceForm">
        <div class="form-row">
          <input type="text" id="placeName" placeholder="اسم المكان" required />
          <input type="text" id="placeCity" placeholder="المدينة أو المنطقة" required />
          <select id="placeCategory">
            <option value="مطاعم ومقاهي">مطاعم ومقاهي</option>
            <option value="إلكترونيات">إلكترونيات</option>
            <option value="خدمات">خدمات</option>
          </select>
        </div>
        <button type="submit" class="submit-btn">إضافة المكان</button>
      </form>
    </section>
  </main>

  <script>
    const defaultPlaces = [
      { id: 1, name: "واحة البن للقهوة", city: "القاهرة", category: "مطاعم ومقاهي" },
      { id: 2, name: "تك زون للصيانة", city: "الإسكندرية", category: "إلكترونيات" },
      { id: 3, name: "ركن الساحل للمأكولات", city: "مرسى مطروح", category: "مطاعم ومقاهي" },
      { id: 4, name: "استوديو تصميم ويب", city: "الجيزة", category: "خدمات" }
    ];

    let places = JSON.parse(localStorage.getItem("pi_places_data") || "null") || defaultPlaces;
    let favorites = JSON.parse(localStorage.getItem("pi_places_favs") || "[]");
    let activeCategory = "الكل";
    let searchQuery = "";

    const gridEl = document.getElementById("placesGrid");
    const searchEl = document.getElementById("searchInput");
    const catBarEl = document.getElementById("categoryBar");
    const formEl = document.getElementById("addPlaceForm");

    function saveState() {
      localStorage.setItem("pi_places_data", JSON.stringify(places));
      localStorage.setItem("pi_places_favs", JSON.stringify(favorites));
    }

    function toggleFav(id) {
      if (favorites.includes(id)) {
        favorites = favorites.filter((item) => item !== id);
      } else {
        favorites.push(id);
      }
      saveState();
      render();
    }

    function render() {
      const filtered = places.filter((p) => {
        const matchesCat =
          activeCategory === "الكل" ||
          (activeCategory === "مفضلة" ? favorites.includes(p.id) : p.category === activeCategory);
        const q = searchQuery.trim().toLowerCase();
        const matchesSearch =
          !q || p.name.toLowerCase().includes(q) || p.city.toLowerCase().includes(q);
        return matchesCat && matchesSearch;
      });

      if (!filtered.length) {
        gridEl.innerHTML = `<div class="empty">لا توجد أماكن مطابقة للبحث الحالي.</div>`;
        return;
      }

      gridEl.innerHTML = filtered
        .map((place) => {
          const isFav = favorites.includes(place.id);
          return `
            <article class="card">
              <div>
                <div class="card-top">
                  <h2>${place.name}</h2>
                  <span class="tag">${place.category}</span>
                </div>
                <p class="meta">الموقع: ${place.city}</p>
              </div>
              <div class="card-actions">
                <span class="pi-accepted">يقبل Pi</span>
                <button class="fav-btn ${isFav ? "saved" : ""}" onclick="toggleFav(${place.id})">
                  ${isFav ? "★ محفوظ" : "☆ حفظ"}
                </button>
              </div>
            </article>
          `;
        })
        .join("");
    }

    searchEl.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      render();
    });

    catBarEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".cat-btn");
      if (!btn) return;
      document.querySelectorAll(".cat-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      activeCategory = btn.dataset.cat;
      render();
    });

    formEl.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("placeName").value.trim();
      const city = document.getElementById("placeCity").value.trim();
      const category = document.getElementById("placeCategory").value;
      if (!name || !city) return;

      places.unshift({
        id: Date.now(),
        name,
        city,
        category
      });
      saveState();
      formEl.reset();
      render();
    });
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
      }
      
    render();
    (function () {
  const LANG_KEY = "pi_places_lang";
  const translations = {
    ar: {
      dir: "rtl",
      lang: "ar",
      title: "Pi Places — دليل الأماكن الداعمة لـ Pi",
      subtitle: "دليل المتاجر والخدمات التي تقبل الدفع بعملة Pi",
      badge: "Pi Network Directory",
      searchPlaceholder: "ابحث باسم المتجر أو المدينة...",
      cats: {
        "الكل": "الكل",
        "مطاعم ومقاهي": "مطاعم ومقاهي",
        "إلكترونيات": "إلكترونيات",
        "خدمات": "خدمات",
        "المفضلة": "المفضلة"
      },
      addTitle: "إضافة مكان جديد إلى الدليل",
      namePlaceholder: "اسم المتجر أو الخدمة",
      cityPlaceholder: "المدينة أو المنطقة",
      submitBtn: "إضافة إلى الدليل",
      locationLabel: "الموقع:",
      acceptsPi: "يقبل Pi",
      saveBtn: "☆ حفظ",
      savedBtn: "★ محفوظ",
      emptyText: "لا توجد أماكن مطابقة للبحث أو التصنيف الحالي."
    },
    en: {
      dir: "ltr",
      lang: "en",
      title: "Pi Places — Pi-Accepted Merchants Directory",
      subtitle: "Directory of stores and services accepting Pi payment",
      badge: "Pi Network Directory",
      searchPlaceholder: "Search by store name or city...",
      cats: {
        "الكل": "All",
        "مطاعم ومقاهي": "Food & Cafes",
        "إلكترونيات": "Electronics",
        "خدمات": "Services",
        "المفضلة": "Favorites"
      },
      addTitle: "Add a New Place to the Directory",
      namePlaceholder: "Store or service name",
      cityPlaceholder: "City or area",
      submitBtn: "Add to Directory",
      locationLabel: "Location:",
      acceptsPi: "Accepts Pi",
      saveBtn: "☆ Save",
      savedBtn: "★ Saved",
      emptyText: "No places match the current search or filter."
    },
    zh: {
      dir: "ltr",
      lang: "zh-CN",
      title: "Pi Places — 支持 Pi 支付的商家指南",
      subtitle: "支持 Pi 支付的门店与服务目录",
      badge: "Pi Network Directory",
      searchPlaceholder: "按商家名称或城市搜索...",
      cats: {
        "الكل": "全部",
        "مطاعم ومقاهي": "餐饮与咖啡",
        "إلكترونيات": "电子产品",
        "خدمات": "生活服务",
        "المفضلة": "收藏夹"
      },
      addTitle: "添加新商家到目录",
      namePlaceholder: "商家或服务名称",
      cityPlaceholder: "城市或区域",
      submitBtn: "添加到目录",
      locationLabel: "位置：",
      acceptsPi: "支持 Pi",
      saveBtn: "☆ 收藏",
      savedBtn: "★ 已收藏",
      emptyText: "没有符合当前搜索或分类的商家。"
    }
  };

  let currentLang = localStorage.getItem(LANG_KEY) || "ar";
  if (!translations[currentLang]) currentLang = "ar";

  function applyI18n() {
    const t = translations[currentLang];
    document.documentElement.lang = t.lang;
    document.documentElement.dir = t.dir;
    document.title = t.title;

    const h1 = document.querySelector("header h1");
    const p = document.querySelector("header p");
    const badge = document.querySelector("header .badge");
    if (h1) h1.textContent = "Pi Places";
    if (p) p.textContent = t.subtitle;
    if (badge) badge.textContent = t.badge;

    const searchInput = document.getElementById("searchInput");
    if (searchInput) searchInput.placeholder = t.searchPlaceholder;

    document.querySelectorAll("#categoryBar .cat-btn").forEach((btn) => {
      const catKey = btn.dataset.cat;
      if (catKey && t.cats[catKey]) {
        btn.textContent = t.cats[catKey];
      }
    });

    const addTitle = document.querySelector(".add-box h3");
    if (addTitle) addTitle.textContent = t.addTitle;

    const placeName = document.getElementById("placeName");
    const placeCity = document.getElementById("placeCity");
    const placeCategory = document.getElementById("placeCategory");
    const submitBtn = document.querySelector("#addPlaceForm .submit-btn");

    if (placeName) placeName.placeholder = t.namePlaceholder;
    if (placeCity) placeCity.placeholder = t.cityPlaceholder;
    if (submitBtn) submitBtn.textContent = t.submitBtn;

    if (placeCategory) {
      Array.from(placeCategory.options).forEach((opt) => {
        if (t.cats[opt.value]) {
          opt.textContent = t.cats[opt.value];
        }
      });
    }

    document.querySelectorAll("#langSwitcher button[data-lang]").forEach((btn) => {
      const active = btn.dataset.lang === currentLang;
      btn.style.background = active ? "#fff" : "rgba(255,255,255,0.18)";
      btn.style.color = active ? "#3f1c66" : "#fff";
      btn.style.border = active ? "none" : "1px solid rgba(255,255,255,0.4)";
      btn.style.fontWeight = active ? "700" : "600";
    });
  }

  const origRender = typeof render === "function" ? render : null;
  if (origRender) {
    window.render = function () {
      applyI18n();
      origRender();
      const t = translations[currentLang];
      document.querySelectorAll("#placesGrid .card").forEach((card) => {
        const tag = card.querySelector(".tag");
        if (tag && t.cats[tag.textContent.trim()]) {
          tag.textContent = t.cats[tag.textContent.trim()];
        }
        const meta = card.querySelector(".meta");
        if (meta) {
          meta.innerHTML = meta.innerHTML
            .replace("الموقع:", t.locationLabel)
            .replace("Location:", t.locationLabel)
            .replace("位置：", t.locationLabel);
        }
        const piBadge = card.querySelector(".pi-accepted");
        if (piBadge) piBadge.textContent = t.acceptsPi;

        const favBtn = card.querySelector("button");
        if (favBtn) {
          const txt = favBtn.textContent.trim();
          const isSaved = txt.startsWith("★");
          favBtn.textContent = isSaved ? t.savedBtn : t.saveBtn;
        }
      });

      const emptyEl = document.querySelector("#placesGrid .empty");
      if (emptyEl) emptyEl.textContent = t.emptyText;
    };
  }

  document.querySelectorAll("#langSwitcher button[data-lang]").forEach((btn) => {
    btn.addEventListener("click", () => {
      currentLang = btn.dataset.lang;
      localStorage.setItem(LANG_KEY, currentLang);
      if (typeof window.render === "function") {
        window.render();
      } else {
        applyI18n();
      }
    });
  });

  applyI18n();
  if (typeof window.render === "function") {
    window.render();
  }
})();

  </script>
</body>
  </html>
