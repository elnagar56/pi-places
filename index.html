<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pi Places — دليل متاجر وتطبيقات Pi</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    :root {
      --primary: #5b21b6;
      --primary-dark: #4c1d95;
      --accent: #f59e0b;
      --accent-dark: #d97706;
      --success: #059669;
      --success-dark: #047857;
      --bg: #f5f3ff;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .hero {
      background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 100%);
      color: #fff;
      padding: 24px 16px 32px;
      text-align: center;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 8px 24px rgba(76, 29, 149, 0.22);
    }

    .lang-switch {
      display: inline-flex;
      gap: 8px;
      margin-bottom: 16px;
      background: rgba(255, 255, 255, 0.14);
      padding: 4px;
      border-radius: 999px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: #fff;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    .lang-btn.active {
      background: #fff;
      color: var(--primary-dark);
    }

    .hero h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .hero p {
      font-size: 15px;
      opacity: 0.95;
      max-width: 540px;
      margin: 0 auto 18px;
      line-height: 1.5;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-gold {
      background: var(--accent);
      color: #111827;
    }

    .btn-white {
      background: #fff;
      color: var(--primary-dark);
    }

    .btn-green {
      background: var(--success);
      color: #fff;
    }

    .btn-purple {
      background: var(--primary);
      color: #fff;
    }

    .btn-outline {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .status-pill {
      display: inline-block;
      margin-top: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.16);
    }

    .container {
      max-width: 760px;
      margin: -16px auto 0;
      padding: 0 14px;
    }

    .toast {
      background: #fef3c7;
      color: #78350f;
      border: 1px solid #f59e0b;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-size: 14px;
      font-weight: 600;
      display: none;
    }

    .toast.show {
      display: block;
    }

    .filter-card {
      background: var(--card);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(17, 24, 39, 0.06);
      margin-bottom: 16px;
    }

    .search-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid var(--border);
      background: #f9fafb;
      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .place-card {
      background: var(--card);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 16px rgba(17, 24, 39, 0.06);
      margin-bottom: 14px;
    }

    .place-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .category-badge {
      background: #ede9fe;
      color: var(--primary-dark);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .app-badge {
      background: #d1fae5;
      color: var(--success-dark);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .place-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .place-meta {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .place-desc {
      color: #374151;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .place-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.58);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 1000;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 5px;
      color: #374151;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }

    textarea {
      min-height: 72px;
      resize: vertical;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    .fee-box {
      background: #f5f3ff;
      border: 1px solid #ddd6fe;
      color: var(--primary-dark);
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      margin: 12px 0 14px;
      line-height: 1.5;
    }

    #detailMap {
      width: 100%;
      height: 230px;
      border-radius: 14px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }

    .detail-link-box {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .detail-link-url {
      font-size: 12px;
      color: #065f46;
      word-break: break-all;
      margin-bottom: 10px;
    }

    .no-link-note {
      background: #f9fafb;
      border: 1px dashed #d1d5db;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    @media (max-width: 520px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="lang-switch">
      <button type="button" class="lang-btn" data-lang="zh" onclick="setLang('zh')">中文</button>
      <button type="button" class="lang-btn" data-lang="en" onclick="setLang('en')">English</button>
      <button type="button" class="lang-btn active" data-lang="ar" onclick="setLang('ar')">العربية</button>
    </div>

    <h1>Pi Places</h1>
    <p id="heroSubtitle">بوابة اكتشاف المتاجر والتطبيقات والخدمات في شبكة Pi</p>

    <div class="hero-actions">
      <button type="button" class="btn btn-gold" onclick="loginWithPi()">دخول بحساب Pi</button>
      <button type="button" class="btn btn-green" onclick="openAddModal()">+ أضف متجرك</button>
    </div>

    <div class="status-pill" id="piStatus">وضع التصفح — افتح داخل Pi Browser لإتمام الدفع</div>
  </header>

  <main class="container">
    <div class="toast" id="toastBox"></div>

    <section class="filter-card">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="ابحث باسم المتجر أو التطبيق أو المدينة..."
        oninput="renderPlaces()"
      />
      <div class="chips" id="categoryChips">
        <button type="button" class="chip active" data-cat="all" onclick="selectCategory('all')">الكل</button>
        <button type="button" class="chip" data-cat="restaurants" onclick="selectCategory('restaurants')">مطاعم ومقاهي</button>
        <button type="button" class="chip" data-cat="electronics" onclick="selectCategory('electronics')">إلكترونيات</button>
        <button type="button" class="chip" data-cat="services" onclick="selectCategory('services')">خدمات</button>
        <button type="button" class="chip" data-cat="favorites" onclick="selectCategory('favorites')">المفضلة</button>
      </div>
    </section>

    <section id="placesList"></section>
  </main>

  <!-- نافذة إضافة متجر -->
  <div class="modal-backdrop" id="addModal">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="modal-title">إضافة متجر أو تطبيق جديد</h2>
        <button type="button" class="btn btn-outline" onclick="closeAddModal()">إغلاق</button>
      </div>

      <form id="addPlaceForm" onsubmit="submitNewPlace(event)">
        <div class="form-group">
          <label for="placeName">اسم المتجر أو التطبيق *</label>
          <input type="text" id="placeName" required placeholder="مثال: مطعم النخيل أو تطبيق سوقي" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="placeCity">المدينة *</label>
            <input type="text" id="placeCity" required placeholder="مثال: القاهرة" />
          </div>

          <div class="form-group">
            <label for="placeCategory">التصنيف *</label>
            <select id="placeCategory">
              <option value="restaurants">مطاعم ومقاهي</option>
              <option value="electronics">إلكترونيات</option>
              <option value="services">خدمات</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="placeDesc">نبذة مختصرة عن المكان وما يقدمه *</label>
          <textarea id="placeDesc" required placeholder="مثال: يقدم مأكولات شرقية ومنيو متكامل داخل تطبيقه الخاص..."></textarea>
        </div>

        <div class="form-group">
          <label for="placeAppUrl">رابط تطبيق أو صفحة المتجر (اختياري — +0.05 Pi إضافية)</label>
          <input
            type="url"
            id="placeAppUrl"
            placeholder="https://example.com أو رابط تطبيقك (اتركه فارغاً إذا لا يوجد رابط)"
            oninput="updateFeePreview()"
          />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="placeLat">خط العرض (Lat)</label>
            <input type="number" step="any" id="placeLat" value="30.0444" />
          </div>

          <div class="form-group">
            <label for="placeLng">خط الطول (Lng)</label>
            <input type="number" step="any" id="placeLng" value="31.2357" />
          </div>
        </div>

        <div class="form-group">
          <button type="button" class="btn btn-outline" style="width:100%" onclick="detectLocation()">
            تحديد موقعي الحالي تلقائياً
          </button>
        </div>

        <div class="fee-box" id="feePreviewBox">
          رسوم إدراج المكان: <strong>0.10 Pi</strong> (بدون رابط) — أو <strong>0.15 Pi</strong> عند إضافة رابط تطبيق/صفحة المتجر.
        </div>

        <button type="submit" id="submitPlaceBtn" class="btn btn-green" style="width:100%">
          دفع 0.10 Pi ونشر المكان
        </button>
      </form>
    </div>
  </div>

  <!-- نافذة تفاصيل المتجر -->
  <div class="modal-backdrop" id="detailModal">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <h2 class="modal-title" id="detailTitle"></h2>
          <div class="place-meta" id="detailMeta" style="margin-bottom:0"></div>
        </div>
        <button type="button" class="btn btn-outline" onclick="closeDetailModal()">إغلاق</button>
      </div>

      <p class="place-desc" id="detailDesc"></p>

      <div id="detailMap"></div>

      <div id="detailLinkSection"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "pi_places_directory_v1";
    const FAV_KEY = "pi_places_favorites_v1";

    const DEFAULT_PLACES = [
      {
        id: "place-1",
        name: "واحة البن للقهوة",
        city: "القاهرة",
        category: "restaurants",
        desc: "مقهى مختص بالقهوة العربية والتركية والمشروبات الباردة، ويمكنك تصفح قائمة المشروبات والطلبات عبر صفحة المتجر.",
        appUrl: "https://pi.network",
        lat: 30.0444,
        lng: 31.2357
      },
      {
        id: "place-2",
        name: "تك زون للصيانة",
        city: "الإسكندرية",
        category: "electronics",
        desc: "مركز صيانة هواتف وحواسيب وبيع إكسسوارات أصلية مع حجز المواعيد من خلال صفحة الخدمة.",
        appUrl: "",
        lat: 31.2001,
        lng: 29.9187
      }
    ];

    const CATEGORY_LABELS = {
      restaurants: "مطاعم ومقاهي",
      electronics: "إلكترونيات",
      services: "خدمات"
    };

    let currentLang = "ar";
    let currentCategory = "all";
    let piUser = null;
    let detailMapInstance = null;

    function showToast(message) {
      const box = document.getElementById("toastBox");
      box.textContent = message;
      box.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        box.classList.remove("show");
      }, 4500);
    }

    function setLang(lang) {
      currentLang = lang;
      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      document.documentElement.lang = lang;
    }

    function loadPlaces() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_PLACES));
          return [...DEFAULT_PLACES];
        }
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) && parsed.length ? parsed : [...DEFAULT_PLACES];
      } catch (e) {
        return [...DEFAULT_PLACES];
      }
    }

    function savePlaces(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }

    function loadFavorites() {
      try {
        return JSON.parse(localStorage.getItem(FAV_KEY) || "[]");
      } catch (e) {
        return [];
      }
    }

    function toggleFavorite(id) {
      const favs = loadFavorites();
      const idx = favs.indexOf(id);
      if (idx === -1) {
        favs.push(id);
      } else {
        favs.splice(idx, 1);
      }
      localStorage.setItem(FAV_KEY, JSON.stringify(favs));
      renderPlaces();
    }

    function selectCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll(".chip").forEach((chip) => {
        chip.classList.toggle("active", chip.dataset.cat === cat);
      });
      renderPlaces();
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function isValidUrl(val) {
      if (!val || !val.trim()) return false;
      try {
        const u = new URL(val.trim());
        return u.protocol === "https:" || u.protocol === "http:";
      } catch (e) {
        return false;
      }
    }

    function getListingFee(urlValue) {
      return isValidUrl(urlValue) ? 0.15 : 0.10;
    }

    function updateFeePreview() {
      const rawUrl = document.getElementById("placeAppUrl").value.trim();
      const hasUrl = isValidUrl(rawUrl);
      const fee = hasUrl ? "0.15" : "0.10";
      const box = document.getElementById("feePreviewBox");
      const btn = document.getElementById("submitPlaceBtn");

      if (hasUrl) {
        box.innerHTML = "تمت إضافة رابط تطبيق/صفحة المتجر: إجمالي الرسوم <strong>0.15 Pi</strong> (0.10 Pi إدراج + 0.05 Pi للرابط).";
      } else {
        box.innerHTML = "إدراج المكان بدون رابط: الرسوم <strong>0.10 Pi</strong> (يمكن إضافة رابط لاحقاً برسوم +0.05 Pi).";
      }
      btn.textContent = `دفع ${fee} Pi ونشر المكان`;
    }

    function renderPlaces() {
      const list = loadPlaces();
      const favs = loadFavorites();
      const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
      const container = document.getElementById("placesList");

      const filtered = list.filter((p) => {
        const matchesCat =
          currentCategory === "all" ||
          (currentCategory === "favorites" && favs.includes(p.id)) ||
          p.category === currentCategory;

        const matchesQuery =
          !q ||
          (p.name || "").toLowerCase().includes(q) ||
          (p.city || "").toLowerCase().includes(q) ||
          (p.desc || "").toLowerCase().includes(q);

        return matchesCat && matchesQuery;
      });

      if (!filtered.length) {
        container.innerHTML = `<div class="place-card"><p class="place-meta">لا توجد أماكن مطابقة للبحث الحالي.</p></div>`;
        return;
      }

      container.innerHTML = filtered
        .map((p) => {
          const isFav = favs.includes(p.id);
          const hasApp = isValidUrl(p.appUrl);
          return `
            <article class="place-card">
              <div class="place-top">
                <span class="category-badge">${escapeHtml(CATEGORY_LABELS[p.category] || p.category)}</span>
                ${hasApp ? `<span class="app-badge">له تطبيق / صفحة</span>` : ""}
              </div>
              <h3 class="place-title">${escapeHtml(p.name)}</h3>
              <div class="place-meta">${escapeHtml(p.city)}</div>
              <p class="place-desc">${escapeHtml(p.desc || "")}</p>
              <div class="place-actions">
                <button type="button" class="btn btn-purple" onclick="openPlaceDetail('${escapeHtml(p.id)}')">
                  عرض المكان والخريطة
                </button>
                <button type="button" class="btn btn-outline" onclick="toggleFavorite('${escapeHtml(p.id)}')">
                  ${isFav ? "★ محفوظ" : "☆ حفظ"}
                </button>
              </div>
            </article>
          `;
        })
        .join("");
    }

    function openAddModal() {
      document.getElementById("addPlaceForm").reset();
      document.getElementById("placeLat").value = "30.0444";
      document.getElementById("placeLng").value = "31.2357";
      updateFeePreview();
      document.getElementById("addModal").classList.add("open");
    }

    function closeAddModal() {
      document.getElementById("addModal").classList.remove("open");
    }

    function detectLocation() {
      if (!navigator.geolocation) {
        showToast("المتصفح لا يدعم تحديد الموقع التلقائي.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          document.getElementById("placeLat").value = pos.coords.latitude.toFixed(6);
          document.getElementById("placeLng").value = pos.coords.longitude.toFixed(6);
          showToast("تم تحديد موقعك الحالي بنجاح.");
        },
        () => {
          showToast("تعذر الوصول للموقع الحالي، يمكنك إدخال الإحداثيات يدوياً.");
        }
      );
    }

    function initPiSdk() {
      if (window.Pi) {
        try {
          window.Pi.init({ version: "2.0", sandbox: false });
        } catch (e) {
          console.warn(e);
        }
      }
    }

    async function loginWithPi() {
      if (!window.Pi) {
        showToast("افتح التطبيق داخل Pi Browser لتسجيل الدخول بحساب Pi.");
        return;
      }
      try {
        const auth = await window.Pi.authenticate(["username", "payments"], () => {});
        piUser = auth.user;
        document.getElementById("piStatus").textContent = `متصل بحساب Pi: @${piUser.username}`;
        showToast(`مرحباً @${piUser.username}`);
      } catch (err) {
        showToast("تم إلغاء تسجيل الدخول أو تعذر الاتصال بحساب Pi.");
      }
    }

    function payWithPi(amount, memo, metadata) {
      return new Promise((resolve, reject) => {
        if (!window.Pi) {
          reject(new Error("Pi SDK غير متاح خارج Pi Browser."));
          return;
        }
        window.Pi.createPayment(
          {
            amount,
            memo,
            metadata
          },
          {
            onReadyForServerApproval(paymentId) {
              console.log("Ready for approval:", paymentId);
            },
            onReadyForServerCompletion(paymentId, txid) {
              resolve({ paymentId, txid });
            },
            onCancel(paymentId) {
              reject(new Error("تم إلغاء عملية الدفع."));
            },
            onError(error) {
              reject(error || new Error("حدث خطأ أثناء الدفع."));
            }
          }
        );
      });
    }

    async function submitNewPlace(event) {
      event.preventDefault();

      const name = document.getElementById("placeName").value.trim();
      const city = document.getElementById("placeCity").value.trim();
      const category = document.getElementById("placeCategory").value;
      const desc = document.getElementById("placeDesc").value.trim();
      const rawUrl = document.getElementById("placeAppUrl").value.trim();
      const lat = parseFloat(document.getElementById("placeLat").value) || 30.0444;
      const lng = parseFloat(document.getElementById("placeLng").value) || 31.2357;

      if (rawUrl && !isValidUrl(rawUrl)) {
        showToast("يرجى إدخال رابط صحيح يبدأ بـ https:// أو http:// أو تركه فارغاً.");
        return;
      }

      const fee = getListingFee(rawUrl);

      if (!window.Pi) {
        showToast("لإتمام الدفع ونشر المكان، افتح الرابط داخل Pi Browser.");
        return;
      }

      try {
        if (!piUser) {
          await loginWithPi();
        }
        await payWithPi(fee, `إدراج مكان: ${name}`, {
          type: "place_listing",
          hasAppUrl: Boolean(rawUrl),
          name,
          city
        });

        const newPlace = {
          id: "place-" + Date.now(),
          name,
          city,
          category,
          desc,
          appUrl: rawUrl,
          lat,
          lng
        };

        const places = loadPlaces();
        places.unshift(newPlace);
        savePlaces(places);

        closeAddModal();
        renderPlaces();
        showToast(`تم دفع ${fee} Pi ونشر "${name}" بنجاح!`);
      } catch (err) {
        showToast(err && err.message ? err.message : "لم تكتمل عملية الدفع.");
      }
    }

    function openPlaceDetail(id) {
      const places = loadPlaces();
      const place = places.find((p) => p.id === id);
      if (!place) return;

      document.getElementById("detailTitle").textContent = place.name;
      document.getElementById("detailMeta").textContent = `${place.city} • ${CATEGORY_LABELS[place.category] || place.category}`;
      document.getElementById("detailDesc").textContent = place.desc || "";

      const linkSection = document.getElementById("detailLinkSection");
      if (isValidUrl(place.appUrl)) {
        const safeUrl = escapeHtml(place.appUrl.trim());
        linkSection.innerHTML = `
          <div class="detail-link-box">
            <div class="detail-link-url">رابط التطبيق / المتجر: ${safeUrl}</div>
            <a href="${safeUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-green" style="width:100%">
              فتح تطبيق / صفحة المتجر
            </a>
          </div>
        `;
      } else {
        linkSection.innerHTML = `
          <div class="no-link-note">
            هذا المكان مسجل في الدليل بموقعه وبياناته دون رابط تطبيق خارجي حالياً.
          </div>
        `;
      }

      document.getElementById("detailModal").classList.add("open");

      setTimeout(() => {
        if (detailMapInstance) {
          detailMapInstance.remove();
          detailMapInstance = null;
        }
        const lat = Number(place.lat) || 30.0444;
        const lng = Number(place.lng) || 31.2357;
        detailMapInstance = L.map("detailMap").setView([lat, lng], 13);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "&copy; OpenStreetMap"
        }).addTo(detailMapInstance);
        L.marker([lat, lng]).addTo(detailMapInstance).bindPopup(escapeHtml(place.name)).openPopup();
      }, 80);
    }

    function closeDetailModal() {
      document.getElementById("detailModal").classList.remove("open");
    }

    initPiSdk();
    renderPlaces();
  </script>
</body>
</html>
