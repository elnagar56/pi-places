<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pi Places</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #f5f3fa;
      --card: #ffffff;
      --primary: #5b2c83;
      --primary-dark: #431d63;
      --accent: #f4b400;
      --text: #1f1b24;
      --muted: #665f70;
      --border: #e4dff0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      padding: 20px 16px 24px;
      text-align: center;
    }
    header h1 { margin: 0 0 6px; font-size: 1.7rem; }
    header p { margin: 0 0 14px; opacity: 0.92; font-size: 0.95rem; }
    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }
    .btn-lang { background: rgba(255,255,255,0.16); color: #fff; }
    .btn-lang.active { background: #fff; color: var(--primary); }
    .btn-login { background: var(--accent); color: #1b1500; }
    .btn-demo { background: #fff; color: var(--primary); }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      background: rgba(0,0,0,0.22);
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
    }
    .toast {
      max-width: 900px;
      margin: 12px auto 0;
      padding: 12px 14px;
      border-radius: 10px;
      background: #fff7db;
      border: 1px solid #ecd27a;
      color: #4a3700;
      font-size: 0.92rem;
      font-weight: 600;
      display: none;
    }
    .controls {
      max-width: 900px;
      margin: 14px auto;
      padding: 0 14px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }
    input[type="search"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      margin-bottom: 10px;
    }
    .cats { display: flex; flex-wrap: wrap; gap: 8px; }
    .cat-btn { background: #f1edf8; color: var(--text); }
    .cat-btn.active { background: var(--primary); color: #fff; }
    .grid {
      max-width: 900px;
      margin: 0 auto 28px;
      padding: 0 14px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }
    .tag {
      display: inline-block;
      background: #efe9f7;
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .title {
      margin: 8px 0 4px;
      font-size: 1.08rem;
      cursor: pointer;
      color: var(--primary-dark);
    }
    .loc { color: var(--muted); font-size: 0.88rem; margin: 0; }
    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .fav-btn { background: #f5f3fa; color: var(--text); padding: 7px 11px; }
    .fav-btn.saved { background: #fff0c2; color: #593b00; }
    .pay-btn { background: var(--primary); color: #fff; padding: 7px 12px; }
    .open-btn { background: #efe9f7; color: var(--primary); padding: 7px 11px; }
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 999;
    }
    .modal-box {
      background: #fff;
      color: var(--text);
      width: 100%;
      max-width: 500px;
      border-radius: 16px;
      padding: 16px;
      max-height: 88vh;
      overflow-y: auto;
    }
    #mapBox {
      width: 100%;
      height: 200px;
      border-radius: 12px;
      margin: 10px 0 12px;
      border: 1px solid var(--border);
    }
    .prod-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .ic { width: 16px; height: 16px; flex: 0 0 16px; display: inline-block; }
  </style>
</head>
<body>
  <header>
    <h1 id="appTitle">Pi Places</h1>
    <p id="appSub">دليل المتاجر والخدمات التي تقبل الدفع بعملة Pi</p>

    <div class="bar">
      <button class="btn-lang active" data-lang="ar" onclick="setLang('ar')">العربية</button>
      <button class="btn-lang" data-lang="en" onclick="setLang('en')">English</button>
      <button class="btn-lang" data-lang="zh" onclick="setLang('zh')">中文</button>
    </div>

    <div class="bar">
      <button class="btn-login" onclick="piLogin()">
        <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/></svg>
        <span id="loginText">دخول بحساب Pi</span>
      </button>
      <button class="btn-demo" onclick="demoPay('Pi Places Demo', 0.01)">
        <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm1 15h-2v-2h2Zm0-4h-2V7h2Z"/></svg>
        <span id="demoText">تجربة دفع 0.01 Pi</span>
      </button>
    </div>

    <div>
      <span class="status-pill" id="statusPill">
        <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="7"/></svg>
        <span id="statusText">غير متصل بـ Pi</span>
      </span>
    </div>
  </header>

  <div class="toast" id="toastBox"></div>

  <div class="controls">
    <div class="panel">
      <input type="search" id="searchInput" placeholder="ابحث باسم المتجر أو المدينة..." oninput="renderPlaces()" />
      <div class="cats" id="catsBar"></div>
    </div>
  </div>

  <section class="grid" id="placesGrid"></section>

  <div class="modal-bg" id="placeModal" onclick="if(event.target===this) closeModal()">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <h3 id="modalTitle" style="margin:0;"></h3>
        <button onclick="closeModal()" id="closeBtn" style="background:#eee;color:#222;padding:6px 10px;">إغلاق</button>
      </div>
      <p id="modalLoc" class="loc" style="margin:6px 0 6px;"></p>
      <div id="mapBox"></div>
      <div id="modalProducts"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const places = [
      {
        id: 1, name: "واحة البن للقهوة", cat: "cafe", loc: "القاهرة", lat: 30.0444, lng: 31.2357,
        products: [
          { name: "قهوة تركي مضبوط", price: 0.25 },
          { name: "لاتيه ساخن", price: 0.40 }
        ]
      },
      {
        id: 2, name: "تك زون للصيانة", cat: "tech", loc: "الإسكندرية", lat: 31.2001, lng: 29.9187,
        products: [
          { name: "فحص وتشخيص جهاز", price: 1.50 },
          { name: "تنظيف وتغيير معجون", price: 2.00 }
        ]
      },
      {
        id: 3, name: "ركن الساحل للمأكولات", cat: "cafe", loc: "مرسى مطروح", lat: 31.3543, lng: 27.2373,
        products: [
          { name: "وجبة فطار شرقي", price: 0.40 },
          { name: "عصير فريش", price: 0.20 }
        ]
      },
      {
        id: 4, name: "مركز الخدمات الرقمية", cat: "services", loc: "الجيزة", lat: 30.0131, lng: 31.2089,
        products: [
          { name: "إعداد صفحة ويب", price: 0.80 },
          { name: "مراجعة تقنية", price: 1.20 }
        ]
      }
    ];

    const i18n = {
      ar: {
        title: "Pi Places",
        sub: "دليل المتاجر والخدمات التي تقبل الدفع بعملة Pi",
        login: "دخول بحساب Pi",
        demo: "تجربة دفع 0.01 Pi",
        disconnected: "غير متصل بـ Pi",
        connected: "متصل بحساب Pi: ",
        search: "ابحث باسم المتجر أو المدينة...",
        all: "الكل",
        cafe: "مطاعم ومقاهي",
        tech: "إلكترونيات",
        services: "خدمات",
        favs: "المفضلة",
        save: "حفظ",
        saved: "محفوظ",
        details: "المنتجات والخريطة",
        pay: "دفع Pi",
        close: "إغلاق",
        demoMsg: "وضع تجريبي: تم محاكاة دفع {amount} Pi لـ {name} بدون فتح المحفظة.",
        loginMsg: "تم تسجيل الدخول التجريبي بحساب Pi داخل التطبيق."
      },
      en: {
        title: "Pi Places",
        sub: "Directory of stores and services accepting Pi",
        login: "Sign in with Pi",
        demo: "Demo Pay 0.01 Pi",
        disconnected: "Not connected to Pi",
        connected: "Connected as: ",
        search: "Search store or city...",
        all: "All",
        cafe: "Cafes & Food",
        tech: "Electronics",
        services: "Services",
        favs: "Favorites",
        save: "Save",
        saved: "Saved",
        details: "Menu & Map",
        pay: "Pay Pi",
        close: "Close",
        demoMsg: "Demo mode: Simulated {amount} Pi payment for {name} without opening Wallet.",
        loginMsg: "Demo Pi sign-in activated inside the app."
      },
      zh: {
        title: "Pi Places",
        sub: "支持 Pi 支付的商家与服务目录",
        login: "使用 Pi 登录",
        demo: "模拟支付 0.01 Pi",
        disconnected: "未连接 Pi",
        connected: "已连接账户：",
        search: "搜索商家或城市...",
        all: "全部",
        cafe: "餐饮咖啡",
        tech: "电子数码",
        services: "生活服务",
        favs: "收藏",
        save: "收藏",
        saved: "已收藏",
        details: "商品与地图",
        pay: "Pi 支付",
        close: "关闭",
        demoMsg: "演示模式：已为 {name} 模拟支付 {amount} Pi（未打开钱包）。",
        loginMsg: "已在应用内激活 Pi 演示登录。"
      }
    };

    let lang = "ar";
    let cat = "all";
    let user = null;
    let favs = JSON.parse(localStorage.getItem("pi_places_favs") || "[]");
    let mapInstance = null;

    function showToast(msg) {
      const box = document.getElementById("toastBox");
      box.textContent = msg;
      box.style.display = "block";
      box.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function setLang(newLang) {
      lang = newLang;
      document.documentElement.lang = newLang;
      document.documentElement.dir = newLang === "ar" ? "rtl" : "ltr";
      document.querySelectorAll(".btn-lang").forEach(b => {
        b.classList.toggle("active", b.dataset.lang === newLang);
      });
      const t = i18n[lang];
      document.getElementById("appTitle").textContent = t.title;
      document.getElementById("appSub").textContent = t.sub;
      document.getElementById("loginText").textContent = t.login;
      document.getElementById("demoText").textContent = t.demo;
      document.getElementById("searchInput").placeholder = t.search;
      document.getElementById("closeBtn").textContent = t.close;
      updateStatus();
      renderCats();
      renderPlaces();
    }

    function updateStatus() {
      const t = i18n[lang];
      document.getElementById("statusText").textContent = user ? (t.connected + user) : t.disconnected;
    }

    function piLogin() {
      user = "@tamer_pi";
      updateStatus();
      showToast(i18n[lang].loginMsg);
    }

    function demoPay(name, amount) {
      closeModal();
      const msg = i18n[lang].demoMsg.replace("{amount}", amount).replace("{name}", name);
      showToast(msg);
      alert(msg);
    }

    function toggleFav(id) {
      if (favs.includes(id)) favs = favs.filter(x => x !== id);
      else favs.push(id);
      localStorage.setItem("pi_places_favs", JSON.stringify(favs));
      renderPlaces();
    }

    function renderCats() {
      const t = i18n[lang];
      const list = [
        ["all", t.all],
        ["cafe", t.cafe],
        ["tech", t.tech],
        ["services", t.services],
        ["favs", t.favs]
      ];
      document.getElementById("catsBar").innerHTML = list.map(([key, label]) =>
        `<button class="cat-btn ${cat === key ? "active" : ""}" onclick="setCat('${key}')">${label}</button>`
      ).join("");
    }

    function setCat(newCat) {
      cat = newCat;
      renderCats();
      renderPlaces();
    }

    function openPlace(id) {
      const p = places.find(item => item.id === id);
      if (!p) return;
      const t = i18n[lang];
      document.getElementById("modalTitle").textContent = p.name;
      document.getElementById("modalLoc").textContent = p.loc;
      document.getElementById("modalProducts").innerHTML = p.products.map(pr => `
        <div class="prod-row">
          <div>
            <strong>${pr.name}</strong><br/>
            <span class="loc">${pr.price} Pi</span>
          </div>
          <button class="pay-btn" onclick="demoPay('${p.name} - ${pr.name}', ${pr.price})">
            ${t.pay}
          </button>
        </div>
      `).join("");

      document.getElementById("placeModal").style.display = "flex";

      setTimeout(() => {
        if (mapInstance) {
          mapInstance.remove();
          mapInstance = null;
        }
        if (typeof L !== "undefined") {
          mapInstance = L.map("mapBox").setView([p.lat, p.lng], 13);
          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap"
          }).addTo(mapInstance);
          L.marker([p.lat, p.lng]).addTo(mapInstance).bindPopup(p.name).openPopup();
        }
      }, 80);
    }

    function closeModal() {
      document.getElementById("placeModal").style.display = "none";
    }

    function renderPlaces() {
      const t = i18n[lang];
      const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
      const filtered = places.filter(p => {
        const matchCat =
          cat === "all" ||
          (cat === "favs" ? favs.includes(p.id) : p.cat === cat);
        const matchQ = !q || p.name.toLowerCase().includes(q) || p.loc.toLowerCase().includes(q);
        return matchCat && matchQ;
      });

      const starSvg = `<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 2.9 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 7.1-1.01L12 2Z"/></svg>`;
      const mapSvg = `<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 14.5 9 2.5 2.5 0 0 1 12 11.5Z"/></svg>`;

      document.getElementById("placesGrid").innerHTML = filtered.map(p => {
        const isSaved = favs.includes(p.id);
        const startPrice = p.products && p.products[0] ? p.products[0].price : 0.1;
        return `
          <div class="card">
            <div>
              <span class="tag">${t[p.cat] || p.cat}</span>
              <h3 class="title" onclick="openPlace(${p.id})">${p.name}</h3>
              <p class="loc">${p.loc} • ${startPrice} Pi</p>
            </div>
            <div class="card-actions">
              <button class="fav-btn ${isSaved ? "saved" : ""}" onclick="toggleFav(${p.id})">
                ${starSvg}<span>${isSaved ? t.saved : t.save}</span>
              </button>
              <button class="open-btn" onclick="openPlace(${p.id})">
                ${mapSvg}<span>${t.details}</span>
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    setLang("ar");
  </script>
</body>
</html>
