<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5c2d91" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <title>Pi Places — دليل الأماكن الداعمة لـ Pi</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --pi-purple: #5c2d91;
      --pi-purple-dark: #3f1c66;
      --pi-gold: #f5b700;
      --bg: #f6f4fa;
      --card: #ffffff;
      --text: #1e1b2e;
      --muted: #66617a;
      --border: #e4dff0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 48px;
    }

    header {
      background: linear-gradient(135deg, var(--pi-purple-dark), var(--pi-purple));
      color: #fff;
      padding: 20px 16px 26px;
      text-align: center;
    }

    header h1 {
      font-size: 1.55rem;
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.9rem;
      opacity: 0.92;
    }

    .lang-bar {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .lang-btn {
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .lang-btn.active {
      background: #fff;
      color: var(--pi-purple-dark);
      border-color: #fff;
      font-weight: 700;
    }

    .pi-bar {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .pi-btn {
      background: var(--pi-gold);
      color: #1e1b2e;
      border: none;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .pi-btn.secondary {
      background: #ffffff;
      color: var(--pi-purple-dark);
    }

    .pi-status {
      font-size: 0.8rem;
      background: rgba(0, 0, 0, 0.25);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .container {
      max-width: 820px;
      margin: 12px auto 0;
      padding: 0 14px;
    }

    #statusBanner {
      background: #fff8e1;
      color: #6b4c00;
      border: 1px solid var(--pi-gold);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.88rem;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .controls {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.92rem;
      margin-bottom: 10px;
    }

    .categories {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cat-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.83rem;
      cursor: pointer;
    }

    .cat-btn.active {
      background: var(--pi-purple);
      color: #fff;
      border-color: var(--pi-purple);
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }

    .card h2 {
      font-size: 1.03rem;
      color: var(--pi-purple-dark);
    }

    .tag {
      display: inline-block;
      background: #efeaf8;
      color: var(--pi-purple);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 8px;
      font-weight: 600;
      margin-top: 4px;
    }

    .meta {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .pi-accepted {
      font-size: 0.8rem;
      font-weight: 700;
      color: #16794c;
    }

    .fav-btn {
      border: 1px solid var(--border);
      background: #fff;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .fav-btn.saved {
      background: #fff8e1;
      border-color: var(--pi-gold);
      color: #8a6200;
      font-weight: 700;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 14, 34, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 999;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: var(--card);
      border-radius: 16px;
      max-width: 540px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 18px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .close-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 4px 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .address-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 0.88rem;
    }

    #placeMap {
      height: 185px;
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .map-link {
      display: inline-block;
      margin-top: 8px;
      background: var(--pi-purple);
      color: #fff;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .product-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-top: 8px;
      background: #fcfbfe;
    }

    .product-price {
      font-size: 0.84rem;
      color: #16794c;
      font-weight: 700;
    }

    .buy-pi-btn {
      background: var(--pi-gold);
      color: #1e1b2e;
      border: none;
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>Pi Places</h1>
    <p id="subtitleText">دليل المتاجر والخدمات التي تقبل الدفع بعملة Pi</p>

    <div class="lang-bar" id="langBar">
      <button type="button" class="lang-btn active" data-lang="ar">العربية</button>
      <button type="button" class="lang-btn" data-lang="en">English</button>
      <button type="button" class="lang-btn" data-lang="zh">中文</button>
    </div>

    <div class="pi-bar">
      <button type="button" class="pi-btn" id="piLoginBtn">دخول بحساب Pi</button>
      <button type="button" class="pi-btn secondary" id="piTestPayBtn">تجربة دفع 0.01 Pi</button>
      <span class="pi-status" id="piStatusText">غير متصل بـ Pi</span>
    </div>
  </header>

  <main class="container">
    <div id="statusBanner">جاهز — اضغط على أي متجر أو زر لاختبار الاستجابة.</div>

    <section class="controls">
      <input id="searchInput" class="search-input" type="text" placeholder="ابحث باسم المتجر أو المدينة..." />
      <div class="categories" id="categoryBar">
        <button type="button" class="cat-btn active" data-cat="الكل">الكل</button>
        <button type="button" class="cat-btn" data-cat="مطاعم ومقاهي">مطاعم ومقاهي</button>
        <button type="button" class="cat-btn" data-cat="إلكترونيات">إلكترونيات</button>
        <button type="button" class="cat-btn" data-cat="خدمات">خدمات</button>
        <button type="button" class="cat-btn" data-cat="مفضلة">المفضلة</button>
      </div>
    </section>

    <section class="grid" id="placesGrid"></section>
  </main>

  <div class="modal-backdrop" id="placeModal">
    <div class="modal-box" id="modalContent"></div>
  </div>

  <script>
    const i18n = {
      ar: {
        dir: "rtl",
        lang: "ar",
        title: "Pi Places — دليل الأماكن الداعمة لـ Pi",
        subtitle: "دليل المتاجر والخدمات التي تقبل الدفع بعملة Pi",
        searchPlaceholder: "ابحث باسم المتجر أو المدينة...",

        productsTitle: "المنتجات والخدمات والأسعار:",

        saveBtn: "☆ حفظ",
        savedBtn: "★ محفوظ",
        emptyText: "لا توجد أماكن مطابقة للبحث.",
        piLogin: "دخول بحساب Pi",
        piPay: "تجربة دفع 0.01 Pi",
        piDisconnected: "غير متصل بـ Pi",
        piConnected: "مرحباً: ",

        closedMsg: "تم إغلاق النافذة.",
        favUpdatedMsg: "تم تحديث المفضلة.",
        catMsg: "التصنيف الحالي: ",
        testPayMsg: "وضع تجريبي: تم الضغط على زر تجربة دفع 0.01 Pi.",
        demoPayPrefix: "وضع تجريبي: دفع ",
        demoPayFor: " Pi مقابل (",
        piSdkMissing: "تنبيه: افتح التطبيق داخل Pi Browser لتسجيل الدخول بحساب Pi.",
        piLoggingIn: "جاري تسجيل الدخول عبر Pi...",
        piLoginSuccess: "تم الدخول بحساب Pi: ",
        piLoginFail: "تعذر تسجيل الدخول عبر Pi: "
      },
      en: {
        dir: "ltr",
        lang: "en",
        title: "Pi Places — Pi-Accepted Merchants Directory",
        subtitle: "Directory of stores and services accepting Pi payment",
        searchPlaceholder: "Search by store name or city...",
        cats: {
          "الكل": "All",
          "مطاعم ومقاهي": "Food & Cafes",

          "مفضلة": "Favorites"
        },
        locationLabel: "Location:",
        addressLabel: "Address:",
        coordsLabel: "Coordinates:",
        openMapBtn: "Open in Google Maps",
        productsTitle: "Products, Services & Prices:",
        payItemBtn: "Pay with Pi",
        acceptsPi: "Accepts Pi",
        saveBtn: "☆ Save",
        savedBtn: "★ Saved",
        emptyText: "No places match the current search.",
        piLogin: "Sign in with Pi",
        piPay: "Test Pay 0.01 Pi",
        piDisconnected: "Not connected to Pi",
        piConnected: "Hi: ",
        readyMsg: "Ready — tap any place or button to test.",
        closedMsg: "Modal closed.",
        favUpdatedMsg: "Favorites updated.",
        catMsg: "Current category: ",
        testPayMsg: "Demo mode: Test Pay 0.01 Pi button clicked.",
        demoPayPrefix: "Demo mode: Pay ",
        demoPayFor: " Pi for (",
        piSdkMissing: "Notice: Open inside Pi Browser to sign in with Pi.",
        piLoggingIn: "Signing in with Pi...",
        piLoginSuccess: "Signed in with Pi: ",
        piLoginFail: "Pi sign-in failed: "
      },
      zh: {
        dir: "ltr",
        lang: "zh-CN",
        title: "Pi Places — 支持 Pi 支付的商家指南",
        subtitle: "支持 Pi 支付的门店与服务目录",
        searchPlaceholder: "按商家名称或城市搜索...",
        cats: {
          "الكل": "全部",
          "مطاعم ومقاهي": "餐饮与咖啡",
          "إلكترونيات": "电子产品",
          "خدمات": "生活服务",
          "مفضلة": "收藏夹"
        },
        locationLabel: "位置：",
        addressLabel: "地址：",
        coordsLabel: "坐标：",
        openMapBtn: "在谷歌地图中打开",
        productsTitle: "商品、服务与价格：",
        payItemBtn: "使用 Pi 支付",
        acceptsPi: "支持 Pi",
        saveBtn: "☆ 收藏",
        savedBtn: "★ 已收藏",
        emptyText: "没有符合当前搜索的商家。",
        piLogin: "使用 Pi 登录",
        piPay: "测试支付 0.01 Pi",
        piDisconnected: "未连接 Pi",
        piConnected: "你好：",
        readyMsg: "已就绪 — 点击任意商家或按钮进行测试。",
        closedMsg: "窗口已关闭。",
        favUpdatedMsg: "收藏夹已更新。",
        catMsg: "当前分类：",
        testPayMsg: "演示模式：已点击测试支付 0.01 Pi 按钮。",
        demoPayPrefix: "演示模式：支付 ",
        demoPayFor: " Pi 购买（",
        piSdkMissing: "提示：请在 Pi Browser 中打开以使用 Pi 登录。",
        piLoggingIn: "正在使用 Pi 登录...",
        piLoginSuccess: "已使用 Pi 登录：",
        piLoginFail: "Pi 登录失败："
      }
    };

    const places = [
      {
        id: 1,
        name: "واحة البن للقهوة",
        city: "القاهرة",
        address: "المعادي، شارع 9، بجوار محطة المترو",
        lat: 29.9602,
        lng: 31.2569,
        category: "مطاعم ومقاهي",
        products: [
          { title: "قهوة عربية مختصة", pricePi: 0.5 },
          { title: "إسبريسو مزدوج + كرواسون", pricePi: 0.8 }
        ]
      },
      {
        id: 2,
        name: "تك زون للصيانة",
        city: "الإسكندرية",
        address: "سموحة، شارع فوزي معاذ، برج النصر",
        lat: 31.2156,
        lng: 29.9553,
        category: "إلكترونيات",
        products: [
          { title: "فحص وتشخيص أعطال الهواتف", pricePi: 1.0 },
          { title: "شاحن سريع أصلي", pricePi: 1.5 }
        ]
      },
      {
        id: 3,
        name: "ركن الساحل للمأكولات",
        city: "مرسى مطروح",
        address: "كورنيش مرسى مطروح، أمام شاطئ البسنت",
        lat: 31.3543,
        lng: 27.2373,
        category: "مطاعم ومقاهي",
        products: [
          { title: "وجبة أسماك بحرية مشوية", pricePi: 2.5 },
          { title: "عصير ليمون بالنعناع طازج", pricePi: 0.4 }
        ]
      },
      {
        id: 4,
        name: "استوديو تصميم ويب",
        city: "الجيزة",
        address: "الدقي، شارع التحرير، الدور الثالث",
        lat: 30.0385,
        lng: 31.2127,
        category: "خدمات",
        products: [
          { title: "تصميم صفحة تعريفية متجاوبة", pricePi: 5.0 },
          { title: "استشارة ربط تطبيق ويب بـ Pi", pricePi: 3.0 }
        ]
      }
    ];

    let currentLang = "ar";
    let favorites = [];
    let activeCategory = "الكل";
    let searchQuery = "";
    let piUser = null;
    let selectedPlaceId = null;
    let leafletMap = null;

    const statusBanner = document.getElementById("statusBanner");
    const gridEl = document.getElementById("placesGrid");
    const searchEl = document.getElementById("searchInput");
    const catBarEl = document.getElementById("categoryBar");
    const langBarEl = document.getElementById("langBar");
    const modalEl = document.getElementById("placeModal");
    const modalContentEl = document.getElementById("modalContent");
    const piLoginBtn = document.getElementById("piLoginBtn");
    const piTestPayBtn = document.getElementById("piTestPayBtn");
    const piStatusText = document.getElementById("piStatusText");

    function setStatus(text) {
      statusBanner.textContent = text;
    }

    window.onerror = function (msg, src, line) {
      setStatus("خطأ في الكود: " + msg + " (السطر " + line + ")");
    };

    function applyLanguageTexts() {
      const t = i18n[currentLang];
      document.documentElement.dir = t.dir;
      document.documentElement.lang = t.lang;
      document.title = t.title;
      document.getElementById("subtitleText").textContent = t.subtitle;
      searchEl.placeholder = t.searchPlaceholder;
      piLoginBtn.textContent = t.piLogin;
      piTestPayBtn.textContent = t.piPay;

      if (piUser && piUser.username) {
        piStatusText.textContent = t.piConnected + piUser.username;
      } else {
        piStatusText.textContent = t.piDisconnected;
      }

      document.querySelectorAll("#categoryBar .cat-btn").forEach((btn) => {
        const key = btn.dataset.cat;
        if (t.cats[key]) btn.textContent = t.cats[key];
      });

      document.querySelectorAll("#langBar .lang-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === currentLang);
      });
    }

    function initMap(lat, lng, title) {
      if (leafletMap) {
        leafletMap.remove();
        leafletMap = null;
      }
      if (!window.L || !document.getElementById("placeMap")) return;
      try {
        leafletMap = L.map("placeMap").setView([lat, lng], 14);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "&copy; OpenStreetMap"
        }).addTo(leafletMap);
        L.marker([lat, lng]).addTo(leafletMap).bindPopup(title).openPopup();
        setTimeout(() => {
          if (leafletMap) leafletMap.invalidateSize();
        }, 150);
      } catch (e) {
        setStatus("تنبيه الخريطة: " + e.message);
      }
    }

    function openPlaceModal(id, shouldInitMap = true) {
      const place = places.find((p) => p.id === id);
      if (!place) return;
      selectedPlaceId = id;
      const t = i18n[currentLang];
      const catLabel = t.cats[place.category] || place.category;
      const mapUrl = `https://www.google.com/maps?q=${place.lat},${place.lng}`;

      modalContentEl.innerHTML = `
        <div class="modal-header">
          <div>
            <h2>${place.name}</h2>
            <span class="tag">${catLabel}</span>
          </div>
          <button type="button" class="close-btn" id="closeModalBtn">✕</button>
        </div>

        <div class="address-box">
          <div><strong>${t.locationLabel}</strong> ${place.city}</div>
          <div><strong>${t.addressLabel}</strong> ${place.address}</div>
          <div><strong>${t.coordsLabel}</strong> ${place.lat}, ${place.lng}</div>
          <a class="map-link" href="${mapUrl}" target="_blank" rel="noopener noreferrer">${t.openMapBtn}</a>
        </div>

        <div id="placeMap"></div>

        <div><strong>${t.productsTitle}</strong></div>
        ${place.products
          .map(
            (prod) => `
            <div class="product-item">
              <div>
                <div><strong>${prod.title}</strong></div>
                <div class="product-price">${prod.pricePi} Pi</div>
              </div>
              <button type="button" class="buy-pi-btn" data-amount="${prod.pricePi}" data-item="${prod.title}">${t.payItemBtn}</button>
            </div>
          `
          )
          .join("")}
      `;

      modalEl.classList.add("open");
      if (shouldInitMap) {
        initMap(place.lat, place.lng, place.name);
      }
    }

    function closeModal() {
      selectedPlaceId = null;
      if (leafletMap) {
        leafletMap.remove();
        leafletMap = null;
      }
      modalEl.classList.remove("open");
      setStatus(i18n[currentLang].closedMsg);
    }

    function renderPlaces(syncOpenModal = false) {
      applyLanguageTexts();
      const t = i18n[currentLang];

      const filtered = places.filter((p) => {
        const matchCat =
          activeCategory === "الكل" ||
          (activeCategory === "مفضلة" ? favorites.includes(p.id) : p.category === activeCategory);
        const q = searchQuery.trim().toLowerCase();
        const matchSearch =
          !q ||
          p.name.toLowerCase().includes(q) ||
          p.city.toLowerCase().includes(q) ||
          p.address.toLowerCase().includes(q);
        return matchCat && matchSearch;
      });

      if (!filtered.length) {
        gridEl.innerHTML = `<div class="card">${t.emptyText}</div>`;
        return;
      }

      gridEl.innerHTML = filtered
        .map((p) => {
          const isFav = favorites.includes(p.id);
          const catLabel = t.cats[p.category] || p.category;
          return `
            <article class="card" data-place-id="${p.id}">
              <div>
                <h2>${p.name}</h2>
                <span class="tag">${catLabel}</span>
                <p class="meta">${t.locationLabel} ${p.city}</p>
              </div>
              <div class="card-actions">
                <span class="pi-accepted">${t.acceptsPi}</span>
                <button type="button" class="fav-btn ${isFav ? "saved" : ""}" data-fav-id="${p.id}">
                  ${isFav ? t.savedBtn : t.saveBtn}
                </button>
              </div>
            </article>
          `;
        })
        .join("");

      if (syncOpenModal && selectedPlaceId !== null) {
        openPlaceModal(selectedPlaceId, true);
      }
    }

    function triggerDemoPayment(amount, itemTitle) {
      const t = i18n[currentLang];
      const suffix = currentLang === "zh" ? "）" : ")";
      setStatus(t.demoPayPrefix + amount + t.demoPayFor + itemTitle + suffix);
    }

    gridEl.addEventListener("click", (e) => {
      const favBtn = e.target.closest("[data-fav-id]");
      if (favBtn) {
        e.stopPropagation();
        const id = Number(favBtn.dataset.favId);
        favorites = favorites.includes(id)
          ? favorites.filter((x) => x !== id)
          : [...favorites, id];
        renderPlaces(false);
        setStatus(i18n[currentLang].favUpdatedMsg);
        return;
      }

      const card = e.target.closest("[data-place-id]");
      if (card) {
        const id = Number(card.dataset.placeId);
        const place = places.find((p) => p.id === id);
        openPlaceModal(id, true);
        if (place) {
          setStatus(place.name);
        }
      }
    });

    modalEl.addEventListener("click", (e) => {
      if (e.target === modalEl || e.target.closest("#closeModalBtn")) {
        closeModal();
        return;
      }
      const payBtn = e.target.closest(".buy-pi-btn");
      if (payBtn) {
        triggerDemoPayment(payBtn.dataset.amount, payBtn.dataset.item);
      }
    });

    langBarEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".lang-btn");
      if (!btn) return;
      currentLang = btn.dataset.lang;
      renderPlaces(true);
    });

    catBarEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".cat-btn");
      if (!btn) return;
      document.querySelectorAll("#categoryBar .cat-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      activeCategory = btn.dataset.cat;
      renderPlaces(false);
      const catText = i18n[currentLang].cats[activeCategory] || activeCategory;
      setStatus(i18n[currentLang].catMsg + catText);
    });

    searchEl.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderPlaces(false);
    });

    piTestPayBtn.addEventListener("click", () => {
      setStatus(i18n[currentLang].testPayMsg);
    });

    piLoginBtn.addEventListener("click", async () => {
      const t = i18n[currentLang];
      setStatus(t.piLoggingIn);
      if (!window.Pi) {
        setStatus(t.piSdkMissing);
        return;
      }
      try {
        window.Pi.init({ version: "2.0", sandbox: true });
        const auth = await window.Pi.authenticate(["username", "payments"], () => {});
        piUser = auth.user || null;
        renderPlaces(selectedPlaceId !== null);
        const username = piUser && piUser.username ? piUser.username : "Pioneer";
        setStatus(t.piLoginSuccess + username);
      } catch (err) {
        const msg = err && err.message ? err.message : String(err);
        setStatus(t.piLoginFail + msg);
      }
    });

    renderPlaces(false);
    setStatus(i18n[currentLang].readyMsg);
  </script>
</body>
</html>
