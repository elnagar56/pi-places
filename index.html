<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pi Places — دليل المتاجر والخدمات التي تقبل الدفع بعملة Pi</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --primary: #5b21b6;
      --primary-dark: #4c1d95;
      --accent: #f59e0b;
      --bg: #f4f5f9;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 100%);
      color: #fff;
      padding: 28px 16px 34px;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    header p {
      opacity: 0.92;
      font-size: 0.98rem;
      margin-bottom: 18px;
    }

    .lang-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .lang-btn {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 6px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .lang-btn.active {
      background: #fff;
      color: var(--primary-dark);
    }

    .auth-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-pi {
      background: #fbbf24;
      color: #1f2937;
      border: none;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .btn-demo {
      background: #ffffff;
      color: #1f2937;
      border: none;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .user-badge {
      margin-top: 12px;
      display: inline-block;
      background: rgba(0, 0, 0, 0.25);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.88rem;
    }

    .container {
      max-width: 780px;
      margin: -18px auto 24px;
      padding: 0 14px;
    }

    .filter-box {
      background: var(--card);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
      margin-bottom: 18px;
    }

    .search-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      margin-bottom: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .cats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cat-btn {
      background: #f3f4f6;
      color: var(--text);
      border: none;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .cat-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .notice-banner {
      background: #fef3c7;
      color: #78350f;
      border: 1px solid #fde68a;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 0.92rem;
      display: none;
    }

    .places-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .place-card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    .place-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }

    .place-cat {
      background: #ede9fe;
      color: var(--primary-dark);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .place-title {
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .place-meta {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 14px;
    }

    .place-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-secondary {
      background: #f3f4f6;
      color: var(--text);
      border: 1px solid #d1d5db;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 999;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    #map {
      height: 220px;
      width: 100%;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .product-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-top: 1px solid var(--border);
      gap: 10px;
    }

    .product-name {
      font-weight: 700;
      font-size: 1rem;
    }

    .product-price {
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer {
      text-align: center;
      padding: 22px 14px 30px;
      margin-top: 28px;
      border-top: 1px solid var(--border);
      background: #fff;
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer a {
      color: var(--primary-dark);
      text-decoration: none;
      font-weight: 700;
      margin: 0 8px;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <div class="lang-bar">
      <button class="lang-btn active" data-lang="ar" onclick="setLang('ar')">العربية</button>
      <button class="lang-btn" data-lang="en" onclick="setLang('en')">English</button>
      <button class="lang-btn" data-lang="zh" onclick="setLang('zh')">中文</button>
    </div>

    <h1 id="appTitle">Pi Places</h1>
    <p id="appSubtitle">دليل المتاجر والخدمات التي تقبل الدفع بعملة Pi</p>

    <div class="auth-bar">
      <button class="btn-pi" id="loginBtn" onclick="loginWithPi()">دخول بحساب Pi</button>
      <button class="btn-demo" id="demoBtn" onclick="demoPayment()">تجربة دفع 0.01 Pi</button>
    </div>

    <div id="userStatus" class="user-badge" style="display:none;"></div>
  </header>

  <main class="container">
    <div class="filter-box">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="ابحث باسم المتجر أو المدينة..."
        oninput="renderPlaces()"
      />
      <div class="cats">
        <button class="cat-btn active" data-cat="all" onclick="selectCat('all', this)">الكل</button>
        <button class="cat-btn" data-cat="food" onclick="selectCat('food', this)">مطاعم ومقاهي</button>
        <button class="cat-btn" data-cat="electronics" onclick="selectCat('electronics', this)">إلكترونيات</button>
        <button class="cat-btn" data-cat="services" onclick="selectCat('services', this)">خدمات</button>
        <button class="cat-btn" data-cat="fav" onclick="selectCat('fav', this)">المفضلة</button>
      </div>
    </div>

    <div id="noticeBanner" class="notice-banner"></div>

    <section id="placesList" class="places-list"></section>
  </main>

  <div id="placeModal" class="modal-backdrop" onclick="closeModalOnBackdrop(event)">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <h2 id="modalPlaceTitle"></h2>
          <div id="modalPlaceCity" class="product-price"></div>
        </div>
        <button class="btn-secondary" onclick="closeModal()">إغلاق</button>
      </div>
      <div id="map"></div>
      <div id="modalProducts"></div>
    </div>
  </div>

  <footer>
    <div>Pi Places — Local Places</div>
    <div style="margin-top: 8px;">
      <a href="https://elnagar56.github.io/privacy.html" target="_blank" rel="noopener noreferrer">سياسة الخصوصية</a>
      <span>|</span>
      <a href="https://elnagar56.github.io/terms.html" target="_blank" rel="noopener noreferrer">الشروط والأحكام</a>
    </div>
  </footer>

  <script>
    const BACKEND_URL = "https://pi-places-backend.vercel.app";
    const APP_NAME = "Pi Places - Local Places";

    let currentLang = "ar";
    let currentCat = "all";
    let currentUser = null;
    let mapInstance = null;
    let favorites = JSON.parse(localStorage.getItem("pi_places_favs") || "[]");

    const PLACES = [
      {
        id: "coffee-oasis",
        name: "واحة البن للقهوة",
        city: "القاهرة",
        cat: "food",
        lat: 30.0444,
        lng: 31.2357,
        products: [
          { id: "turkish-coffee", name: "قهوة تركي مضبوط", price: 0.25 },
          { id: "hot-latte", name: "لاتيه ساخن", price: 0.40 }
        ]
      },
      {
        id: "tech-zone",
        name: "تك زون للصيانة",
        city: "الإسكندرية",
        cat: "electronics",
        lat: 31.2001,
        lng: 29.9187,
        products: [
          { id: "screen-check", name: "فحص وتشخيص جهاز", price: 0.50 },
          { id: "fast-cable", name: "كابل شحن سريع", price: 0.30 }
        ]
      },
      {
        id: "coast-corner",
        name: "ركن الساحل للمأكولات",
        city: "مرسى مطروح",
        cat: "food",
        lat: 31.3543,
        lng: 27.2373,
        products: [
          { id: "fresh-meal", name: "وجبة بحرية سريعة", price: 0.60 }
        ]
      }
    ];

    if (window.Pi) {
      Pi.init({ version: "2.0", sandbox: true });
    }

    function setLang(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });
      renderPlaces();
    }

    function selectCat(cat, el) {
      currentCat = cat;
      document.querySelectorAll(".cat-btn").forEach((b) => b.classList.remove("active"));
      if (el) el.classList.add("active");
      renderPlaces();
    }

    function toggleFav(id) {
      if (favorites.includes(id)) {
        favorites = favorites.filter((x) => x !== id);
      } else {
        favorites.push(id);
      }
      localStorage.setItem("pi_places_favs", JSON.stringify(favorites));
      renderPlaces();
    }

    function showNotice(msg) {
      const banner = document.getElementById("noticeBanner");
      banner.textContent = msg;
      banner.style.display = "block";
    }

    async function loginWithPi() {
      try {
        if (!window.Pi) {
          currentUser = { username: "nassem51323" };
          updateUserBadge();
          showNotice("تم تسجيل الدخول في الوضع التجريبي بحساب @nassem51323");
          return;
        }
        const scopes = ["username", "payments"];
        const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
        currentUser = auth.user;
        updateUserBadge();
      } catch (err) {
        showNotice("تعذر تسجيل الدخول عبر Pi: " + (err && err.message ? err.message : err));
      }
    }

    function updateUserBadge() {
      const badge = document.getElementById("userStatus");
      if (currentUser && currentUser.username) {
        badge.textContent = "متصل بحساب Pi: @" + currentUser.username;
        badge.style.display = "inline-block";
      }
    }

    function demoPayment() {
      const msg = `وضع تجريبي: تم محاكاة دفع 0.01 Pi لـ ${APP_NAME} Demo بدون فتح المحفظة.`;
      showNotice(msg);
      alert(msg);
    }

    function onIncompletePaymentFound(payment) {
      if (payment && payment.identifier) {
        fetch(`${BACKEND_URL}/complete`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            paymentId: payment.identifier,
            txid: payment.transaction && payment.transaction.txid ? payment.transaction.txid : ""
          })
        }).catch(() => {});
      }
    }

    async function payForProduct(placeName, productName, amount) {
      if (!window.Pi) {
        demoPayment();
        return;
      }

      try {
        if (!currentUser) {
          await loginWithPi();
        }

        const memo = `${APP_NAME} - ${placeName} - ${productName}`;
        await Pi.createPayment(
          {
            amount: Number(amount),
            memo: memo,
            metadata: { app: APP_NAME, place: placeName, product: productName }
          },
          {
            onReadyForServerApproval: async function (paymentId) {
              await fetch(`${BACKEND_URL}/approve`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ paymentId })
              });
            },
            onReadyForServerCompletion: async function (paymentId, txid) {
              await fetch(`${BACKEND_URL}/complete`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ paymentId, txid })
              });
              showNotice(`تم إتمام الدفع بنجاح (${amount} Pi) مقابل ${productName}`);
            },
            onCancel: function () {
              showNotice("تم إلغاء عملية الدفع.");
            },
            onError: function (error) {
              showNotice("حدث خطأ أثناء الدفع: " + (error && error.message ? error.message : error));
            }
          }
        );
      } catch (err) {
        showNotice("تعذر بدء عملية الدفع: " + (err && err.message ? err.message : err));
      }
    }

    function openPlaceModal(placeId) {
      const place = PLACES.find((p) => p.id === placeId);
      if (!place) return;

      document.getElementById("modalPlaceTitle").textContent = place.name;
      document.getElementById("modalPlaceCity").textContent = place.city;
      document.getElementById("placeModal").classList.add("open");

      setTimeout(() => {
        if (!mapInstance) {
          mapInstance = L.map("map").setView([place.lat, place.lng], 13);
          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap"
          }).addTo(mapInstance);
        } else {
          mapInstance.setView([place.lat, place.lng], 13);
        }
        mapInstance.eachLayer((layer) => {
          if (layer instanceof L.Marker) mapInstance.removeLayer(layer);
        });
        L.marker([place.lat, place.lng]).addTo(mapInstance).bindPopup(place.name).openPopup();
        mapInstance.invalidateSize();
      }, 120);

      const productsHtml = place.products
        .map(
          (prod) => `
          <div class="product-row">
            <div>
              <div class="product-name">${prod.name}</div>
              <div class="product-price">${prod.price} Pi</div>
            </div>
            <button class="btn-primary" onclick="payForProduct('${place.name.replace(/'/g, "\\'")}', '${prod.name.replace(/'/g, "\\'")}', ${prod.price})">
              دفع Pi
            </button>
          </div>
        `
        )
        .join("");

      document.getElementById("modalProducts").innerHTML = productsHtml;
    }

    function closeModal() {
      document.getElementById("placeModal").classList.remove("open");
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === "placeModal") closeModal();
    }

    function getCatLabel(cat) {
      const map = {
        food: "مطاعم ومقاهي",
        electronics: "إلكترونيات",
        services: "خدمات"
      };
      return map[cat] || cat;
    }

    function renderPlaces() {
      const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
      const filtered = PLACES.filter((p) => {
        const matchesCat =
          currentCat === "all" ||
          (currentCat === "fav" ? favorites.includes(p.id) : p.cat === currentCat);
        const matchesQuery =
          !q ||
          p.name.toLowerCase().includes(q) ||
          p.city.toLowerCase().includes(q);
        return matchesCat && matchesQuery;
      });

      const listEl = document.getElementById("placesList");
      if (!filtered.length) {
        listEl.innerHTML = `<div class="place-card" style="text-align:center;">لا توجد نتائج مطابقة.</div>`;
        return;
      }

      listEl.innerHTML = filtered
        .map((p) => {
          const isFav = favorites.includes(p.id);
          const minPrice = Math.min(...p.products.map((x) => x.price));
          return `
            <div class="place-card">
              <div class="place-top">
                <span class="place-cat">${getCatLabel(p.cat)}</span>
              </div>
              <div class="place-title">${p.name}</div>
              <div class="place-meta">${p.city} • يبدأ من ${minPrice} Pi</div>
              <div class="place-actions">
                <button class="btn-secondary" onclick="openPlaceModal('${p.id}')">المنتجات والخريطة</button>
                <button class="btn-secondary" onclick="toggleFav('${p.id}')">${isFav ? "★ محفوظ" : "☆ حفظ"}</button>
              </div>
            </div>
          `;
        })
        .join("");
    }

    renderPlaces();
  </script>
</body>
</html>
