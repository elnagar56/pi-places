<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pi Places</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, Tahoma, Arial, sans-serif; }
    body { background: #f6f4fa; color: #1e1b2e; padding-bottom: 40px; }
    header { background: #3f1c66; color: #fff; padding: 18px 14px; text-align: center; }
    .bar { margin-top: 10px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    button { cursor: pointer; border: none; border-radius: 8px; padding: 8px 14px; font-weight: 700; }
    .gold { background: #f5b700; color: #1e1b2e; }
    .white { background: #fff; color: #3f1c66; }
    .purple { background: #5c2d91; color: #fff; }
    #debugBox { margin: 12px auto; max-width: 780px; background: #fff3cd; color: #5c3c00; border: 1px solid #f5b700; padding: 10px 14px; border-radius: 10px; font-size: 0.9rem; }
    .wrap { max-width: 780px; margin: 12px auto; padding: 0 12px; }
    .card { background: #fff; border: 1px solid #e4dff0; border-radius: 12px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); align-items: center; justify-content: center; padding: 14px; z-index: 999; }
    #modal.open { display: flex; }
    #modalBox { background: #fff; border-radius: 14px; max-width: 480px; width: 100%; padding: 18px; }
    .item { display: flex; justify-content: space-between; align-items: center; border: 1px solid #e4dff0; border-radius: 8px; padding: 10px; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Pi Places</h1>
    <div class="bar">
      <button type="button" class="gold" id="loginBtn">دخول بحساب Pi</button>
      <button type="button" class="white" id="testPayBtn">تجربة دفع 0.01 Pi</button>
    </div>
  </header>

  <div id="debugBox">جاهز — اضغط على أي زر أو متجر لاختبار الاستجابة.</div>
  <div class="wrap" id="list"></div>

  <div id="modal">
    <div id="modalBox"></div>
  </div>

  <script>
    const debugBox = document.getElementById("debugBox");
    const listEl = document.getElementById("list");
    const modalEl = document.getElementById("modal");
    const modalBox = document.getElementById("modalBox");

    function logMsg(msg) {
      debugBox.textContent = msg;
    }

    window.onerror = function (msg, url, line) {
      logMsg("خطأ برمجي: " + msg + " (سطر " + line + ")");
    };

    const places = [
      { id: 1, name: "واحة البن للقهوة", city: "القاهرة", price: 0.5, item: "قهوة عربية مختصة" },
      { id: 2, name: "تك زون للصيانة", city: "الإسكندرية", price: 1.0, item: "فحص وتشخيص أعطال الهواتف" },
      { id: 3, name: "ركن الساحل للمأكولات", city: "مرسى مطروح", price: 2.5, item: "وجبة أسماك بحرية مشوية" }
    ];

    listEl.innerHTML = places.map(p => `
      <div class="card" data-id="${p.id}">
        <div>
          <strong>${p.name}</strong>
          <div>الموقع: ${p.city}</div>
        </div>
        <button type="button" class="purple open-btn" data-id="${p.id}">فتح المنتجات</button>
      </div>
    `).join("");

    listEl.addEventListener("click", (e) => {
      const target = e.target.closest("[data-id]");
      if (!target) return;
      const id = Number(target.dataset.id);
      const p = places.find(x => x.id === id);
      if (!p) return;
      logMsg("تم فتح: " + p.name);
      modalBox.innerHTML = `
        <h3>${p.name} (${p.city})</h3>
        <div class="item">
          <div>
            <div><strong>${p.item}</strong></div>
            <div>${p.price} Pi</div>
          </div>
          <button type="button" class="gold pay-item-btn" data-amount="${p.price}" data-title="${p.item}">دفع بـ Pi</button>
        </div>
        <div style="margin-top:14px;text-align:left;">
          <button type="button" class="white" style="border:1px solid #ccc;" id="closeBtn">إغلاق</button>
        </div>
      `;
      modalEl.classList.add("open");
    });

    modalEl.addEventListener("click", (e) => {
      if (e.target === modalEl || e.target.id === "closeBtn") {
        modalEl.classList.remove("open");
        logMsg("تم إغلاق النافذة.");
        return;
      }
      const payBtn = e.target.closest(".pay-item-btn");
      if (payBtn) {
        logMsg("وضع تجريبي: تم الضغط على دفع " + payBtn.dataset.amount + " Pi مقابل (" + payBtn.dataset.title + ").");
      }
    });

    document.getElementById("testPayBtn").addEventListener("click", () => {
      logMsg("وضع تجريبي: تم الضغط على زر تجربة دفع 0.01 Pi بنجاح.");
    });

    document.getElementById("loginBtn").addEventListener("click", async () => {
      logMsg("جاري محاولة تسجيل الدخول عبر Pi...");
      if (!window.Pi) {
        logMsg("تنبيه: window.Pi غير متاح في هذه البيئة.");
        return;
      }
      try {
        window.Pi.init({ version: "2.0", sandbox: true });
        const auth = await window.Pi.authenticate(["username", "payments"], () => {});
        logMsg("تم الدخول بنجاح: " + (auth.user && auth.user.username ? auth.user.username : "مستخدم"));
      } catch (err) {
        logMsg("فشل الدخول: " + (err && err.message ? err.message : err));
      }
    });
  </script>
</body>
</html>
